      { id:'AGT-02', nombre:'Agente Auditor-FX', propietario:'Finanzas Andinas', estado:'Activo', skills:['Consultas SQL','Lectura de PDFs'], prompt:'Eres Auditor-FX, agente de conciliación cambiaria para Finanzas Andinas.\n1. Consulta los movimientos diarios en PostgreSQL mediante Consultas SQL de solo lectura.\n2. Cruza tasas de cambio contra extractos bancarios.\n3. Genera un resumen con diferencias superiores a $5.00 USD.' },
      { id:'AGT-03', nombre:'Agente Contratos-ES', propietario:'Estudio Jurídico Vega', estado:'Fallando', skills:['Lectura de PDFs','Envío de Correos'], prompt:'Eres Contratos-ES, revisor de cláusulas mercantiles para Estudio Jurídico Vega.\n1. Analiza borradores PDF buscando penalizaciones, jurisdicción y renovación automática.\n2. Resume riesgos en niveles Alto, Medio y Bajo.\n3. Envía el informe al abogado responsable.' },
      { id:'AGT-04', nombre:'Agente Soporte-24h', propietario:'Retail Nova', estado:'Activo', skills:['Navegación Web','Envío de Correos','Gestión de Calendario'], prompt:'Eres Soporte-24h para Retail Nova.\n1. Responde consultas sobre estado de pedidos consultando el portal de logística.\n2. Agenda llamadas de seguimiento con clientes VIP cuando una incidencia supera las 48 horas.' },

    const skills = [

    const errors = [
      { id:'ERR-9041', timestamp:'2026-11-20 13:14:22', agente:'Agente Contratos-ES', tipo:'Crítico · OCR Timeout', gravedad:'error', descripcion:'Tiempo excedido al procesar un PDF de 42 páginas.', trace:'TimeoutError: PDFOCRWorker exceeded 30000ms limit\n at PdfSkill.extractText (/runtime/skills/pdf-ocr/index.js:142:19)\n at AgentExecutor.runSkill (/runtime/core/executor.js:88:11)\n Context: { agentId: "AGT-03", tenant: "Estudio Jurídico Vega", pages: 42 }' },
      { id:'ERR-9038', timestamp:'2026-11-20 12:47:09', agente:'Agente Ruta-04', tipo:'Crítico · Conexión SQL', gravedad:'error', descripcion:'Pool de conexiones rechazado por PostgreSQL.', trace:'ConnectionRefusedError: ECONNREFUSED 10.24.18.9:5432\n at SqlSkill.query (/runtime/skills/sql-readonly/client.js:61:24)\n Context: { agentId: "AGT-05", tenant: "NorteLogística S.A.", retryAttempt: 3 }' },

    const moreButton = (label) => `<button type="button" data-menu aria-haspopup="menu" aria-expanded="false" aria-label="${label}" class="inline-flex w-8 h-8 items-center justify-center rounded-lg text-[#777586] hover:bg-[#EAE6F3] dark:text-[#C7C4D7] dark:hover:bg-[#35343D] focus:outline-none focus:ring-2 focus:ring-[#5148D7]"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.75"/><circle cx="12" cy="12" r="1.75"/><circle cx="12" cy="19" r="1.75"/></svg></button>`;

      if (kind === 'error') return `<span role="status" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#FFDAD6] text-[#93000A] text-xs font-medium dark:bg-[#93000A] dark:text-[#FFDAD6]"><span class="w-1.5 h-1.5 rounded-full bg-[#BA1A1A] dark:bg-[#FFB4AB]"></span>${text}</span>`;

      return `<span role="status" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#E4E1ED] text-[#464554] text-xs font-medium dark:bg-[#35343D] dark:text-[#C7C4D7]"><span class="w-1.5 h-1.5 rounded-full bg-[#777586] dark:bg-[#918FA0]"></span>${text}</span>`;

    function closeMenus() {
      document.querySelectorAll('[data-dropdown]').forEach(el => el.classList.add('hidden'));

      state.openMenu = null;
    }

    function openModal(title, subtitle, body, width = 'max-w-lg') {
      closeMenus();
      state.modalTrigger = document.activeElement;
      document.getElementById('modal-layer').innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div id="modal-backdrop" class="fixed inset-0 bg-[#1B1B23]/50 dark:bg-[#0E0D15]/75"></div><section role="dialog" aria-modal="true" aria-labelledby="modal-title" class="relative z-10 w-full ${width} max-h-[90vh] overflow-hidden rounded-2xl border border-[#C7C4D7] bg-white shadow-xl dark:border-[#464554] dark:bg-[#35343D]"><header class="flex items-center justify-between gap-4 px-6 py-4 border-b border-[#C7C4D7] dark:border-[#464554]"><div><h2 id="modal-title" class="text-xl font-semibold font-[Red_Hat_Text]">${title}</h2><p class="text-sm text-[#777586] dark:text-[#C7C4D7]">${subtitle}</p></div><button type="button" data-modal-close aria-label="Cerrar modal" class="w-8 h-8 rounded-lg text-[#777586] hover:bg-[#EAE6F3] dark:text-[#C7C4D7] dark:hover:bg-[#464554]">&times;</button></header><div class="px-6 py-5 overflow-y-auto max-h-[65vh]">${body}</div><footer class="flex justify-end px-6 py-4 border-t border-[#C7C4D7] bg-[#F6F2FE] dark:border-[#464554] dark:bg-[#1F1F27]"><button type="button" data-modal-close class="px-4 py-2 rounded-lg border border-[#C7C4D7] bg-white text-sm font-medium hover:bg-[#F0ECF8] dark:border-[#464554] dark:bg-[#1B1B23] dark:hover:bg-[#35343D]">Cerrar</button></footer></section></div>`;
      document.body.classList.add('overflow-hidden');
      document.querySelector('[data-modal-close]').focus();
    }

    function closeModal() {
      document.getElementById('modal-layer').innerHTML = '';
      document.body.classList.remove('overflow-hidden');
      if (state.modalTrigger && document.contains(state.modalTrigger)) state.modalTrigger.focus();

    function updateErrorCount() {
      const count = errors.filter(error => !state.errorsResolved.has(error.id)).length;
      document.getElementById('sidebar-error-count').textContent = count;
    }

    function renderErrors() {
      const rows = errors.map(error => {
        const resolved = state.errorsResolved.has(error.id);
        const typeBadge = statusBadge(error.tipo, error.gravedad);
        const status = resolved ? statusBadge('Resuelto','success') : statusBadge('Pendiente','neutral');
        return `<tr class="hover:bg-[#F6F2FE] dark:hover:bg-[#1F1F27]"><td class="px-5 py-3.5 font-[Red_Hat_Mono] text-xs tabular-nums whitespace-nowrap">${error.timestamp}</td><td class="px-5 py-3.5 font-medium">${error.agente}</td><td class="px-5 py-3.5">${typeBadge}</td><td class="px-5 py-3.5 text-sm text-[#777586] dark:text-[#C7C4D7]">${error.descripcion}</td><td class="px-5 py-3.5">${status}</td><td class="px-5 py-3.5 text-right relative">${moreButton('Acciones para error ' + error.id)}${menu(`<button type="button" role="menuitem" data-action="error-detail" data-id="${error.id}" class="block w-full px-3.5 py-2 text-left text-sm hover:bg-[#F0ECF8] dark:hover:bg-[#464554]">Ver detalle</button><button type="button" role="menuitem" data-action="error-resolve" data-id="${error.id}" class="block w-full px-3.5 py-2 text-left text-sm text-[#15803D] dark:text-[#4ADE80] ${resolved ? 'opacity-50' : ''}" ${resolved ? 'disabled' : ''}>${resolved ? 'Ya resuelto' : 'Marcar como resuelto'}</button>`)}</td></tr>`;
      }).join('');
      document.getElementById('errors-section').innerHTML = `<div class="flex flex-col gap-6"><div><h2 class="text-2xl font-semibold font-[Red_Hat_Text]">Incidencias de ejecución</h2><p class="text-sm text-[#777586] dark:text-[#C7C4D7]">Errores recientes clasificados por gravedad y tipo.</p></div><div class="rounded-xl border border-[#C7C4D7] bg-white overflow-visible dark:border-[#464554] dark:bg-[#1B1B23]"><div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead class="bg-[#F6F2FE] border-b border-[#C7C4D7] dark:bg-[#1F1F27] dark:border-[#464554]"><tr><th class="px-5 py-3.5 text-xs">Timestamp</th><th class="px-5 py-3.5 text-xs">Agente</th><th class="px-5 py-3.5 text-xs">Tipo / Gravedad</th><th class="px-5 py-3.5 text-xs">Descripción</th><th class="px-5 py-3.5 text-xs">Estado</th><th class="px-5 py-3.5 text-right text-xs">Acciones</th></tr></thead><tbody class="divide-y divide-[#C7C4D7] dark:divide-[#464554]">${rows}</tbody></table></div></div></div>`;
      updateErrorCount();

    function renderSection(section) {
      document.querySelectorAll('[data-panel]').forEach(panel => panel.classList.toggle('hidden', panel.dataset.panel !== section));
      document.querySelectorAll('[data-section]').forEach(button => {
        const active = button.dataset.section === section;
        button.classList.toggle('bg-[#E3DFFF]', active);
        button.classList.toggle('text-[#2C2961]', active);
        button.classList.toggle('dark:bg-[#42407A]', active);
        button.classList.toggle('dark:text-[#E3DFFF]', active);
        if (active) button.setAttribute('aria-current', 'page'); else button.removeAttribute('aria-current');
      });
      const titles = { dashboard:'Dashboard', users:'Gestión de Usuarios', agents:'Gestión de Agentes', skills:'Skills', contracts:'Contrataciones', errors:'Log de errores' };
      document.getElementById('section-title').textContent = titles[section];
      state.activeSection = section;
      closeMenus();
    }

    document.getElementById('main-nav').addEventListener('click', event => {
      const button = event.target.closest('[data-section]');
      if (!button) return;
      renderSection(button.dataset.section);
      if (window.innerWidth < 1024) {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.add('hidden');
        sidebar.classList.remove('fixed','inset-y-0','left-0','z-40','shadow-xl');
      }
    });

    document.addEventListener('click', event => {
      const menuButton = event.target.closest('[data-menu]');
      if (menuButton) {
        event.stopPropagation();
        const dropdown = menuButton.parentElement.querySelector('[data-dropdown]');
        const wasOpen = !dropdown.classList.contains('hidden');
        closeMenus();
        if (!wasOpen) { dropdown.classList.remove('hidden'); menuButton.setAttribute('aria-expanded','true'); state.openMenu = dropdown; }
        return;
      }
      if (!event.target.closest('[data-dropdown]')) closeMenus();

      const modalClose = event.target.closest('[data-modal-close]') || event.target.id === 'modal-backdrop';
      if (modalClose) closeModal();

      const skillToggle = event.target.closest('[data-agent-skills]');
      if (skillToggle) {
        const panel = skillToggle.closest('article').querySelector('[data-agent-panel]');
        const open = skillToggle.getAttribute('aria-expanded') === 'true';
        skillToggle.setAttribute('aria-expanded', String(!open));
        panel.classList.toggle('hidden', open);
      }

      const action = event.target.closest('[data-action]');
      if (!action) return;
      closeMenus();
      if (action.dataset.action === 'noop') return;
      if (action.dataset.action === 'user-detail') {
        const user = users.find(item => item.id === action.dataset.id);
        openModal('Detalle de usuario', user.id + ' · Registro desde ' + user.registro, `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Empresa</p><p class="font-medium">${user.nombre}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Contacto</p><p>${user.contacto}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Correo</p><p class="font-[Red_Hat_Mono] text-xs">${user.email}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">País</p><p>${user.pais}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Plan</p><p>${user.plan}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Estado</p><p>${user.estado}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Agentes asignados</p><p>${user.agentes}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Facturación mensual</p><p class="font-semibold tabular-nums">${user.gasto}</p></div></div>`);
      }
      if (action.dataset.action === 'agent-config') {
        const agent = agents.find(item => item.id === action.dataset.id);
        openModal('Configuración del agente', agent.nombre + ' · ' + agent.propietario, `<p class="text-xs text-[#777586] dark:text-[#C7C4D7] mb-2">PROMPT DE SISTEMA COMPLETO</p><pre class="p-4 rounded-lg border border-[#C7C4D7] bg-[#F6F2FE] font-[Red_Hat_Mono] text-xs whitespace-pre-wrap max-h-80 overflow-y-auto dark:border-[#464554] dark:bg-[#1F1F27]">${agent.prompt}</pre>`, 'max-w-2xl');
      }
      if (action.dataset.action === 'skill-detail') {
        const skill = skills.find(item => item.id === action.dataset.id);
        openModal('Detalle de skill', skill.id + ' · ' + skill.version, `<div class="flex flex-col gap-4"><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Nombre</p><p class="font-semibold">${skill.nombre}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Descripción</p><p class="text-sm">${skill.descripcion}</p></div><div class="grid grid-cols-2 gap-4"><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Tarifa mensual</p><p class="font-semibold tabular-nums">${skill.precio}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Agentes habilitados</p><p>${skill.agentes}</p></div></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Permisos</p><p class="font-[Red_Hat_Mono] text-xs">${skill.permisos}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Agentes vinculados</p><p class="text-sm">${skill.vinculados}</p></div></div>`);
      }
      if (action.dataset.action === 'contract-detail') {
        const contract = contracts.find(item => item.id === action.dataset.id);
        const skillRows = contract.skills.map(skill => `<div class="flex items-center justify-between py-2 border-b border-[#C7C4D7] dark:border-[#464554]"><span class="text-sm">${skill[0]}</span><span class="font-[Red_Hat_Mono] text-xs tabular-nums">${skill[1]}</span></div>`).join('');
        openModal('Desglose del contrato', contract.id + ' · ' + contract.inicio + ' al ' + contract.fin, `<div class="flex flex-col gap-4"><div class="grid grid-cols-2 gap-4"><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Cliente</p><p class="font-medium">${contract.cliente}</p></div><div><p class="text-xs text-[#777586] dark:text-[#C7C4D7]">Agente alquilado</p><p class="font-medium">${contract.agente}</p></div></div><div class="rounded-lg border border-[#C7C4D7] p-4 dark:border-[#464554]"><p class="text-xs text-[#777586] mb-2 dark:text-[#C7C4D7]">Desglose de conceptos</p><div class="flex items-center justify-between py-2 border-b border-[#C7C4D7] dark:border-[#464554]"><span class="text-sm">Licencia base del agente</span><span class="font-[Red_Hat_Mono] text-xs tabular-nums">$${contract.base.toLocaleString('en-US',{minimumFractionDigits:2})}</span></div>${skillRows}<div class="flex items-center justify-between py-2 border-b border-[#C7C4D7] text-[#B45309] dark:border-[#464554] dark:text-[#FBBF24]"><span class="text-sm">Descuento aplicado</span><span class="font-[Red_Hat_Mono] text-xs tabular-nums">-$${contract.descuento.toLocaleString('en-US',{minimumFractionDigits:2})}</span></div><div class="flex items-center justify-between pt-3 font-semibold"><span>Total pagado</span><span class="tabular-nums">${contract.total}</span></div></div></div>`, 'max-w-xl');
      }
      if (action.dataset.action === 'error-detail') {
        const error = errors.find(item => item.id === action.dataset.id);
        openModal('Traza del error', error.id + ' · ' + error.agente + ' · ' + error.timestamp, `<p class="text-xs text-[#777586] mb-2 dark:text-[#C7C4D7]">STACK TRACE COMPLETO</p><pre class="p-4 rounded-lg border border-[#C7C4D7] bg-[#F6F2FE] font-[Red_Hat_Mono] text-xs whitespace-pre-wrap max-h-80 overflow-y-auto dark:border-[#464554] dark:bg-[#1F1F27]">${error.trace}</pre>`, 'max-w-2xl');
      }
      if (action.dataset.action === 'error-resolve') {
        state.errorsResolved.add(action.dataset.id);
        renderErrors();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') { closeMenus(); closeModal(); }
      if (event.key === 'Tab' && document.querySelector('#modal-layer [role="dialog"]')) {
        const dialog = document.querySelector('#modal-layer [role="dialog"]');
        const focusable = Array.from(dialog.querySelectorAll('button:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'));
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.setAttribute('aria-pressed', String(document.documentElement.classList.contains('dark')));
    themeToggle.addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      themeToggle.setAttribute('aria-pressed', String(dark));
      try { localStorage.setItem('agenthub-theme', dark ? 'dark' : 'light'); } catch (e) {}
    });

    document.getElementById('mobile-nav-btn').addEventListener('click', () => {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
      sidebar.classList.toggle('fixed');
      sidebar.classList.toggle('inset-y-0');
      sidebar.classList.toggle('left-0');
      sidebar.classList.toggle('z-40');
      sidebar.classList.toggle('shadow-xl');
    });

    renderDashboard();
    renderUsers();
    renderAgents();
    renderSkills();
    renderContracts();
    renderErrors();
    renderSection('dashboard');
  </script>
</body>
</html>
